<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyMusic</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyMusic">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*, *::before, *::after { box-sizing: border-box; }
:root { color-scheme: dark; background: #0f151a; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); height: 100%; }
body { margin: 0; font: 14px system-ui, sans-serif; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Base styles; the full-screen phone layout below overrides parts of them. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --ink: #1d2a33;
  --muted: #5b6a74;
  --line: #d5dde2;
  --accent: #1f6f78;
  --accent-soft: #dcecee;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191e; --surface: #1a242b; --ink: #e6edf1; --muted: #9aaab4; --line: #2b3943;
    --accent: #6cc3cb; --accent-soft: #1d3a3e; --warn: #f0b860; --warn-soft: #3a2c14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12191e; --surface: #1a242b; --ink: #e6edf1; --muted: #9aaab4; --line: #2b3943;
  --accent: #6cc3cb; --accent-soft: #1d3a3e; --warn: #f0b860; --warn-soft: #3a2c14; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 7vw, 42px); line-height: 1.1; margin: 0; text-wrap: balance; }
section { display: flex; flex-direction: column; gap: 12px; }
.empty { color: var(--muted); margin: 0; }
.import { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
button, .filebtn {
  font: inherit; font-size: 16px; font-weight: 700; border-radius: 10px; padding: 10px 18px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
}
button.ghost { background: transparent; color: var(--accent); }
button.danger { background: transparent; color: var(--warn); border-color: var(--warn); }
button:focus-visible, .filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.runline { font-size: 14px; color: var(--muted); margin: 0; }
.money { display: flex; flex-direction: column; gap: 14px; }
.player .now { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
.np-title { font-family: var(--display); font-weight: 600; font-size: 21px; color: var(--accent); overflow-wrap: anywhere; }
.np-meta { font-size: 14px; color: var(--muted); }
.seekrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player input[type=range] { width: 100%; accent-color: var(--accent); min-width: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls #bPlay { min-width: 64px; font-size: 18px; }
.controls .ghost[aria-pressed="true"], .pick .ghost[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.vol { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-left: auto; min-width: 0; }
.vol input { width: 110px; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pick input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filebtn.ghostbtn { background: transparent; color: var(--accent); }
.playlist { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; border-top: 1px solid var(--line); }
.playlist li { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
.playlist li.cur { background: var(--accent-soft); }
.playlist .name { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; text-align: left; border: 0; background: transparent; color: inherit; padding: 4px 0; font: inherit; font-weight: inherit; }
.playlist li.cur .name { font-weight: 700; color: var(--accent); }
.playlist .star { font-size: 18px; padding: 0 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.playlist .star.on { color: var(--warn); }
</style>
<style>
:root, :root[data-theme] { --bg: #0f151a; --surface: #172028; --ink: #e6edf1; --muted: #9aaab4; --line: #2b3943;
  --accent: #6cc3cb; --accent-soft: #1d3a3e; --warn: #f0b860; --warn-soft: #3a2c14; color-scheme: dark; }
/* Full-screen phone layout: the player fills the screen height; only the song list scrolls. */
html, body { height: 100%; }
body { padding-block: 10px; box-sizing: border-box; overflow: hidden; }
.wrap { height: 100%; gap: 0; }
h1 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; }
.player { flex: 1; min-height: 0; gap: 14px; box-sizing: border-box; }
#musicBody { flex: 1; min-height: 0; }
.player .now { padding: 18px 16px; }
.np-title { font-size: 24px; }
.controls { flex-wrap: nowrap; }
.controls button { flex: 1; font-size: 22px; padding: 14px 0; }
.controls #bShuffle { font-size: 15px; }
.vol { margin-left: 0; flex: 1; }
.volrow { display: flex; gap: 12px; align-items: center; }
.volrow #bKaraoke, .volrow #bRepeat { font-size: 15px; padding: 8px 10px; flex: none; }
.volrow .vol { min-width: 110px; }
.volrow.novol .vol { display: none; }
.volrow.novol button { flex: 1 !important; }
.controls .ghost[aria-pressed="true"], .volrow .ghost[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.vol input { flex: 1; width: auto; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick > * { text-align: center; white-space: nowrap; min-width: 0; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; }
.lists { flex: 1; min-height: 120px; overflow-y: auto; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
.lists[hidden], .sheet[hidden] { display: none; }
.lrow { display: flex; gap: 8px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.lrow .lname { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; font-size: 16px; }
.lrow .lname small { color: var(--muted); font-size: 13px; margin-left: 6px; }
.lrow.cur { background: var(--accent-soft); }
.lrow.cur .lname { color: var(--accent); font-weight: 700; }
.lrow button { font-size: 13px; padding: 5px 10px; flex: none; }
.lrow input, .newlist input { font: inherit; font-size: 16px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; flex: 1; }
.newlist { display: flex; gap: 8px; padding: 12px 4px; }
.newlist button { font-size: 15px; padding: 7px 14px; }
.lhint { color: var(--muted); font-size: 14px; padding: 8px 4px; margin: 0; }
.playlist .add { font-size: 20px; padding: 0 10px; border: 0; background: transparent; color: var(--accent); cursor: pointer; flex: none; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 480px; max-height: 75vh; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
.sheet-title { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.sheet-opts { display: flex; flex-direction: column; gap: 8px; }
.sheet-opts button { text-align: left; font-size: 16px; }
.sheet .newlist { padding: 0; }
.pick .ghost { font-size: 15px; padding-inline: 8px; }
.playlist { flex: 1; min-height: 120px; max-height: none; }
.playlist li { padding: 12px 4px; font-size: 16px; }
.lyrics { flex: 1; min-height: 120px; overflow-y: auto; border-top: 1px solid var(--line); padding: 12px 4px 0; font-size: 19px; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }
.lyrics::after { content: ""; display: block; height: 30vh; }
.lyrsync[hidden] { display: none; }
.lyrics p { margin: 0 0 10px; color: var(--muted); }
.lyrics.plain p, .lyrics p.on { color: var(--ink); }
.lyrics p.on { font-weight: 700; color: var(--accent); }
.lyrics .empty { color: var(--muted); font-size: 16px; }
.lyrsync { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.lyrsync button { font-size: 15px; padding: 8px 6px; }
.lyrsync span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; min-width: 5.5em; }
@media (prefers-reduced-motion: no-preference) { .lyrics p { transition: color .2s; } }
@media (min-width: 700px) { .wrap { max-width: 480px; } }
</style>

<div class="wrap">
  <section class="import player" aria-labelledby="h-music">
    <h1 id="h-music">MyMusic</h1>
    <div id="musicBody" class="money">
      <div class="now">
        <span class="np-title" id="npTitle">No song playing</span>
        <span class="np-meta" id="npMeta">Choose songs from your iCloud Drive or Music folder to start.</span>
      </div>
      <div class="seekrow">
        <span id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in song">
        <span id="tDur">0:00</span>
      </div>
      <div class="controls">
        <button type="button" class="ghost" id="bPrev" aria-label="Previous song">⏮</button>
        <button type="button" id="bPlay" aria-label="Play">▶</button>
        <button type="button" class="ghost" id="bNext" aria-label="Next song">⏭</button>
        <button type="button" class="ghost" id="bShuffle" aria-pressed="false">Shuffle</button>
      </div>
      <div class="volrow">
        <label class="vol">Vol <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></label>
        <button type="button" class="ghost" id="bRepeat" aria-pressed="true">Repeat all</button>
        <button type="button" class="ghost" id="bKaraoke" aria-pressed="false">Karaoke</button>
      </div>
      <div class="pick">
        <label class="filebtn" for="songs">Choose songs<input type="file" id="songs" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" multiple></label>
        <button type="button" class="ghost" id="bLists" aria-pressed="false">Playlists</button>
        <button type="button" class="ghost" id="bFavOnly" aria-pressed="false">Favourites only</button>
        <button type="button" class="ghost" id="bLyrics" aria-pressed="false">Lyrics</button>
      </div>
      <p class="runline" id="musicHint">Loading your library…</p>
      <ol class="playlist" id="playlist"></ol>
      <div class="lists" id="lists" hidden></div>
      <div class="lyrics" id="lyrics" hidden aria-live="off"></div>
      <div class="lyrsync" id="lyrSync" hidden>
        <button type="button" class="ghost" id="bLyrEarlier">◀ Lyrics earlier</button>
        <span id="lyrOfs" aria-live="polite">In time</span>
        <button type="button" class="ghost" id="bLyrLater">Lyrics later ▶</button>
      </div>
      <audio id="audio" preload="metadata"></audio>
      <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-box">
        <p class="sheet-title" id="sheetTitle"></p>
        <div class="sheet-opts" id="sheetOpts"></div>
        <form class="newlist" id="sheetNew"><input id="sheetName" placeholder="New playlist name" maxlength="40" aria-label="New playlist name"><button type="submit" class="ghost">Add</button></form>
        <button type="button" class="danger" id="sheetRemove">Remove from library</button>
        <button type="button" id="sheetDone">Done</button>
      </div></div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
// Songs are copied into this app's IndexedDB storage when picked, so they load by themselves next time.
// Favourites, playlists and settings stay in localStorage, keyed by song name.
let music = { favourites: [], volume: 80, shuffle: false, favOnly: false, playlists: {}, active: null, repeat: "all" };
let saveMusic = async () => { try { localStorage.setItem("music", JSON.stringify(music)); } catch (e) {} };
let songs = [], order = [], pos = -1;
let audio = $("audio"); // replaced by a fresh element when Karaoke is switched off (see resetAudio)
const songName = f => f.name.replace(/\.[^.]+$/, "");
const fmtClock = s => !isFinite(s) ? "0:00" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const isFav = s => music.favourites.includes(s.name);
// Named playlists hold song names only; the active one filters the songs picked this visit.
const inActive = s => !music.active || (music.playlists[music.active] || []).includes(s.name);
let listsOpen = false;
// Song library: one IndexedDB record per song { id: "file name|size", name, size, blob, added }.
// Store "lyrics" caches lyrics found online, keyed by song name (moved out of localStorage, which fills up at ~5 MB).
let storageOK = "indexedDB" in window;
const DB = new Promise((res, rej) => {
  if (!storageOK) return rej(new Error("no IndexedDB"));
  const r = indexedDB.open("mymusic", 2);
  r.onupgradeneeded = () => {
    const db = r.result;
    if (!db.objectStoreNames.contains("songs")) db.createObjectStore("songs", { keyPath: "id" });
    if (!db.objectStoreNames.contains("lyrics")) db.createObjectStore("lyrics");
  };
  r.onsuccess = () => { r.result.onversionchange = () => r.result.close(); res(r.result); };
  r.onerror = () => rej(r.error);
});
function idb(mode, fn, store = "songs") {
  return DB.then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, mode); let out;
    const q = fn(tx.objectStore(store)); if (q) q.onsuccess = () => { out = q.result; };
    tx.oncomplete = () => res(out); tx.onerror = tx.onabort = () => rej(tx.error || new Error("storage error"));
  }));
}
const MIME = { mp3: "audio/mpeg", m4a: "audio/mp4", aac: "audio/aac", wav: "audio/wav", flac: "audio/flac", ogg: "audio/ogg" };
const mimeOf = f => f.type || MIME[(f.name.match(/\.(\w+)$/) || [])[1]?.toLowerCase()] || "audio/mpeg";
const fmtSize = n => n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : Math.round(n / 1e6) + " MB";
const librarySize = () => songs.reduce((t, s) => t + (s.size || 0), 0);
// Replace the song list, keeping the current song playing and its place in the order.
function setSongs(list) {
  const cur = pos >= 0 ? songs[order[pos]] : null;
  songs = list.sort((a, b) => a.name.localeCompare(b.name));
  buildOrder(false);
  pos = cur ? order.indexOf(songs.indexOf(cur)) : -1;
  renderPlayer(); if (listsOpen) renderLists();
}
function stopPlayback() {
  audio.pause(); audio.removeAttribute("src"); audio.load();
  if (audio.dataset.url) { URL.revokeObjectURL(audio.dataset.url); delete audio.dataset.url; }
  $("tCur").textContent = "0:00"; $("tDur").textContent = "0:00"; $("seek").value = 0;
}
async function loadLibrary() {
  try {
    const recs = await idb("readonly", st => st.getAll());
    setSongs(recs.map(r => ({ id: r.id, name: r.name, size: r.size, file: r.blob })));
    $("musicHint").textContent = songs.length
      ? songs.length + " songs in your library (" + fmtSize(librarySize()) + "). Tap Choose songs to add more."
      : "Tap Choose songs to add music from Files or iCloud Drive. Songs are saved in this app, so you only add them once.";
  } catch (e) {
    storageOK = false;
    $("musicHint").textContent = "Couldn't open this phone's song storage, so songs won't be saved. Pick songs each visit.";
  }
}
async function removeSong(s) {
  try { if (storageOK) await idb("readwrite", st => { st.delete(s.id); }); }
  catch (e) { $("musicHint").textContent = "Couldn't remove “" + s.name + "”. Try again."; return; }
  if (pos >= 0 && songs[order[pos]] === s) stopPlayback();
  setSongs(songs.filter(x => x !== s)); showLyrics();
  $("musicHint").textContent = "Removed “" + s.name + "” from your library. " + songs.length + " songs left.";
}
async function clearLibrary() {
  try { if (storageOK) await idb("readwrite", st => { st.clear(); }); }
  catch (e) { $("musicHint").textContent = "Couldn't clear the library. Try again."; return; }
  stopPlayback(); setSongs([]); showLyrics();
  $("musicHint").textContent = "Library cleared. Your original files in Files and iCloud Drive are untouched.";
}
function buildOrder(keepCurrent) {
  const cur = pos >= 0 ? order[pos] : null;
  let idx = songs.map((_, i) => i).filter(i => (!music.favOnly || isFav(songs[i])) && inActive(songs[i]));
  if (music.shuffle) for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  order = idx;
  pos = keepCurrent && cur != null ? order.indexOf(cur) : -1;
}
function playAt(p) {
  if (!order.length) return;
  pos = (p + order.length) % order.length;
  const s = songs[order[pos]];
  if (audio.dataset.url) URL.revokeObjectURL(audio.dataset.url);
  audio.dataset.url = URL.createObjectURL(s.file);
  audio.src = audio.dataset.url;
  audio.play().catch(() => {});
  renderPlayer(); showLyrics();
}
function renderPlayer() {
  const cur = pos >= 0 ? songs[order[pos]] : null;
  updateMediaSession();
  $("npTitle").textContent = cur ? cur.name : "No song playing";
  $("npMeta").textContent = cur ? "Song " + (pos + 1) + " of " + order.length + (music.favOnly ? " favourites" : "") + (music.active ? " in “" + music.active + "”" : "") + (isFav(cur) ? " · ★ favourite" : "")
    : songs.length ? songs.length + " songs in your library. Press play or tap a song." : "Choose songs from your iCloud Drive or Music folder to start.";
  $("bPlay").textContent = audio.paused ? "▶" : "❚❚";
  $("bPlay").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
  $("bShuffle").setAttribute("aria-pressed", String(music.shuffle));
  $("bFavOnly").setAttribute("aria-pressed", String(music.favOnly));
  $("bFavOnly").textContent = "★ Favourites (" + music.favourites.length + ")";
  const ol = $("playlist"); ol.replaceChildren();
  if (!songs.length && music.favourites.length) {
    music.favourites.slice().sort().forEach(n => { const li = el("li"); li.append(el("span", "star on", "★"), el("span", "name", n)); ol.append(li); });
    return;
  }
  // Draw the list in one go, but cap it so a very large selection can't freeze the page.
  const frag = document.createDocumentFragment();
  songs.slice(0, 1000).forEach((s, i) => {
    const li = el("li" , order[pos] === i ? "cur" : "");
    const star = el("button", "star" + (isFav(s) ? " on" : ""), isFav(s) ? "★" : "☆"); star.type = "button";
    star.setAttribute("aria-label", (isFav(s) ? "Remove from" : "Add to") + " favourites: " + s.name);
    star.addEventListener("click", () => {
      music.favourites = isFav(s) ? music.favourites.filter(n => n !== s.name) : [...music.favourites, s.name];
      if (music.favOnly) buildOrder(true);
      renderPlayer(); saveMusic().catch(() => {});
    });
    const name = el("button", "name song-name", s.name);
    name.type = "button";
    name.setAttribute("aria-label", "Play " + s.name);
    name.addEventListener("click", () => {
      if ((music.favOnly && !isFav(s)) || !inActive(s)) { music.favOnly = false; music.active = null; buildOrder(false); }
      playAt(order.indexOf(i));
    });
    const add = el("button", "add", "＋"); add.type = "button";
    add.setAttribute("aria-label", "Add or remove " + s.name + " from playlists");
    add.addEventListener("click", () => openSheet(s));
    li.append(star, name, add); frag.append(li);
  });
  ol.append(frag);
  if (songs.length > 1000) ol.append(el("li", "runline", (songs.length - 1000) + " more songs are loaded and will play, but aren't listed."));
}
// Picked songs are added to the library (not replacing it). Same name and size counts as already added.
let importing = false;
async function importSongs(fileList) {
  const files = [...fileList].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|flac|ogg)$/i.test(f.name));
  if (!files.length) { $("musicHint").textContent = "No music files found there. Pick MP3 or other audio files."; return; }
  if (importing) return;
  importing = true;
  if (storageOK && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const have = new Set(songs.map(s => s.id));
  let fresh = [], added = 0, skipped = 0, failed = 0, full = false;
  for (let k = 0; k < files.length; k++) {
    const f = files[k], id = f.name + "|" + f.size;
    if (have.has(id)) { skipped++; continue; }
    $("musicHint").textContent = "Saving songs into the app: " + (k + 1) + " of " + files.length + "… keep the app open.";
    try {
